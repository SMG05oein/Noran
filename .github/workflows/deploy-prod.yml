# 실서버 배포 — Actions 탭에서 수동 실행만 가능 (push로 자동 배포되지 않음)
name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy to production"
        required: true
        default: all
        type: choice
        options: [all, backend, frontend]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  backend:
    if: inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: chmod +x gradlew && ./gradlew clean bootJar --no-daemon

      - name: Upload JAR + deploy.sh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Back/build/libs/Dwaeji.jar,Back/deploy.sh"
          target: "/home/opc/uploads/back-prod"
          overwrite: true

      - name: Deploy production API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            mkdir -p /home/opc/build/libs
            cp -f /home/opc/uploads/back-prod/Back/build/libs/Dwaeji.jar /home/opc/build/libs/Dwaeji.jar
            cp -f /home/opc/uploads/back-prod/Back/deploy.sh /home/opc/deploy.sh
            chmod +x /home/opc/deploy.sh
            # CI가 deploy.sh를 직접 호출하므로 watch_deploy와 겹치면 이중 배포될 수 있음
            bash /home/opc/deploy.sh

  frontend:
    if: inputs.target == 'all' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Install & build (production)
        run: |
          npm ci
          npm run build

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Front/dist"
          target: "/home/opc/uploads/front-prod"
          overwrite: true

      - name: Publish to www
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            SRC="/home/opc/uploads/front-prod/Front/dist"
            DEST="/var/www/dwaeji/html"
            if [ ! -d "$SRC" ]; then
              echo "ERROR: missing upload at $SRC" >&2
              find /home/opc/uploads/front-prod -maxdepth 3 -type d >&2 || true
              exit 1
            fi
            mkdir -p "$DEST"
            rsync -a --delete "$SRC"/ "$DEST"/
            echo "Published production frontend → $DEST"
