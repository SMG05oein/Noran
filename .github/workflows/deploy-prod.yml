# main 브랜치 push → 실서버 자동 배포
# Back 변경 → api / Front 변경 → www
# (워크플로 파일만 바꾼 push는 실배포하지 않음)
name: Deploy Prod

on:
  push:
    branches: [main]
    paths:
      - "Back/**"
      - "Front/**"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy to production"
        required: true
        default: all
        type: choice
        options: [all, backend, frontend]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Back/**'
            frontend:
              - 'Front/**'

  backend:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend')
      || github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: chmod +x gradlew && ./gradlew clean bootJar --no-daemon

      - name: Upload JAR + deploy.sh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Back/build/libs/Dwaeji.jar,Back/deploy.sh"
          target: "/home/opc/uploads/back-prod"
          overwrite: true

      - name: Deploy production API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            mkdir -p /home/opc/build/libs
            cp -f /home/opc/uploads/back-prod/Back/build/libs/Dwaeji.jar /home/opc/build/libs/Dwaeji.jar
            cp -f /home/opc/uploads/back-prod/Back/deploy.sh /home/opc/deploy.sh
            chmod +x /home/opc/deploy.sh
            bash /home/opc/deploy.sh

  frontend:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'frontend')
      || github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Install & build (production)
        run: |
          npm ci
          npm run build

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Front/dist"
          target: "/home/opc/uploads/front-prod"
          overwrite: true

      - name: Publish to www
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            SRC="/home/opc/uploads/front-prod/Front/dist"
            DEST="/var/www/dwaeji/html"
            if [ ! -d "$SRC" ]; then
              echo "ERROR: missing upload at $SRC" >&2
              find /home/opc/uploads/front-prod -maxdepth 3 -type d >&2 || true
              exit 1
            fi
            mkdir -p "$DEST"
            rsync -a --delete "$SRC"/ "$DEST"/
            echo "Published production frontend → $DEST"
