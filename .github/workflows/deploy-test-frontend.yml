# test 브랜치 + Front 변경 → testwww
name: Deploy Test Frontend

on:
  push:
    branches: [test]
    paths:
      - "Front/**"
      - ".github/workflows/deploy-test-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-test-frontend
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Install & build (test)
        run: |
          npm ci
          npm run build:test

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Front/dist"
          target: "/home/opc/uploads/front-test"
          overwrite: true

      - name: Publish to testwww
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            SRC="/home/opc/uploads/front-test/Front/dist"
            DEST="/var/www/dwaeji-test/html"
            mkdir -p "$DEST"
            rsync -a --delete "$SRC"/ "$DEST"/
            echo "Published test frontend → $DEST"
